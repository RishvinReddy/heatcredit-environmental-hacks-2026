# samconfig.toml — AWS SAM deployment configuration
# Generated/edited manually; committed to Git (no secrets here)

version = 0.1

[default]
[default.global.parameters]
stack_name = "heatcredit-dev"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
stack_name       = "heatcredit-dev"
region           = "ap-south-1"
confirm_changeset = false
capabilities     = "CAPABILITY_IAM"
parameter_overrides = "Stage=dev"
s3_bucket        = "aws-sam-cli-managed-default-samclisourcebucket-f1pcsn1y9qao"

[default.local_start_api.parameters]
port = 3001
warm_containers = "EAGER"

[default.local_invoke.parameters]
# Used by: sam local invoke HealthFunction
